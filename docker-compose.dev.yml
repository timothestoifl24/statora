# Backing services for local development. The app itself runs on the host:
#   docker compose -f docker-compose.dev.yml up -d
#   uv run statora init --seed && uv run statora dev
# Optional SSO test IdPs: docker compose -f docker-compose.dev.yml --profile sso up -d
name: statora-dev

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: statora
      POSTGRES_PASSWORD: statora
      POSTGRES_DB: statora
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"

  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  openldap:
    profiles: ["sso"]
    image: docker.io/bitnamilegacy/openldap:2.6  # bitnami/* images left Docker Hub in 2025
    environment:
      LDAP_ROOT: dc=example,dc=org
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_USERS: alice,bob
      LDAP_PASSWORDS: alicepassword,bobpassword
      LDAP_GROUP: statora-admins
    ports:
      - "1389:1389"

volumes:
  pgdata-dev:
