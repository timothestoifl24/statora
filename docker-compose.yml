# Production stack: one app container + PostgreSQL + Redis.
#   cp .env.example .env   # then set STATORA_SECRET_KEY, POSTGRES_PASSWORD, STATORA_BASE_URL
#   docker compose up -d
#   docker compose exec app statora create-admin
name: statora

services:
  app:
    build: .
    image: statora:latest
    restart: unless-stopped
    env_file: .env
    environment:
      STATORA_DATABASE_URL: postgresql+asyncpg://statora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/statora
      STATORA_REDIS_URL: redis://redis:6379/0
    ports:
      - "${STATORA_HTTP_PORT:-8000}:8000"
    # Lets the unprivileged app user send ICMP echo requests for ping monitors.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: statora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: statora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statora"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
