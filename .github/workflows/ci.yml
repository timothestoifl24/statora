name: CI

on:
  # main only receives merges from develop, which must already pass CI.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes exact version tags only
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statora
          POSTGRES_PASSWORD: statora
          POSTGRES_DB: statora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U statora" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      openldap:
        image: bitnamilegacy/openldap:2.6
        env:
          LDAP_ROOT: dc=example,dc=org
          LDAP_ADMIN_USERNAME: admin
          LDAP_ADMIN_PASSWORD: adminpassword
          LDAP_USERS: alice,bob
          LDAP_PASSWORDS: alicepassword,bobpassword
          LDAP_GROUP: statora-admins
        ports: ["1389:1389"]
      # Targets for SQL monitors (Oracle tests only run locally: its image is large and slow to start).
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: statora
          MARIADB_PASSWORD: statora
          MARIADB_DATABASE: statora
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 3s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Statora-ci-1
        ports: ["1433:1433"]
    env:
      STATORA_TEST_DATABASE_URL: postgresql+asyncpg://statora:statora@localhost:5432/statora_test
      STATORA_TEST_REDIS_URL: redis://localhost:6379/15
      STATORA_TEST_LDAP_URL: ldap://localhost:1389
      STATORA_TEST_MYSQL_URL: mysql://statora:statora@localhost:3306/statora
      STATORA_TEST_MSSQL_URL: mssql://sa:Statora-ci-1@localhost:1433
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes exact version tags only
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install libxmlsec1 (SAML)
        # xmlsec and lxml are built against the system libxml2, like in the container image.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libxml2-dev libxslt1-dev zlib1g-dev libxmlsec1-dev libxmlsec1-openssl
      - run: uv sync --frozen --all-extras --no-binary-package xmlsec --no-binary-package lxml
      - name: Wait for OpenLDAP
        # LDAP tests skip themselves when the server isn't up yet, so make sure it is.
        run: |
          for _ in $(seq 1 60); do (echo > /dev/tcp/localhost/1389) 2>/dev/null && exit 0; sleep 1; done
          echo "OpenLDAP did not start" && exit 1
      - name: Wait for SQL Server
        # It accepts connections a while before logins work; SQL tests skip unreachable servers.
        run: |
          uv run python - <<'PY'
          import time, pytds
          for _ in range(90):
              try:
                  pytds.connect(dsn="localhost", user="sa", password="Statora-ci-1", login_timeout=2).close()
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("SQL Server did not start")
          PY
      - run: uv run pytest -q -rs
