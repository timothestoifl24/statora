name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action never checks out pull request code, so pull_request_target is safe here.
permissions:
  actions: write
  contents: write # stores signatures in the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/timothestoifl24/statora/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: timothestoifl24,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/timothestoifl24/statora/blob/main/CLA.md)
            and reply to this pull request with the sentence below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
