name: Website & docs

# GitHub Pages hosts one site per repository, so every deployment builds both branches:
#   main    → statora.timothestoifl24.dev/      (production)
#   develop → statora.timothestoifl24.dev/dev/  (development, see DOCS_CHANNEL in docs/.vitepress/config.mts)
# A push to either branch deploys both. Pull requests only build their own docs.
on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - CHANGELOG.md # included in the website
      - SECURITY.md # included in the website
      - "src/**" # the OpenAPI spec published with the docs
      - scripts/export_openapi.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - "docs/**"
      - CHANGELOG.md # included in the website
      - SECURITY.md # included in the website
      - "src/**" # the OpenAPI spec published with the docs
      - scripts/export_openapi.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One group for all deployments: a newer run builds both branches anyway.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'site' }}
  cancel-in-progress: true

jobs:
  check:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes exact version tags only
        with:
          python-version: "3.15"
          enable-cache: true
      - name: Export the OpenAPI spec
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python scripts/export_openapi.py docs/public/openapi.json
      - run: npm ci
        working-directory: docs
      - run: npm run docs:build
        working-directory: docs
        env:
          DOCS_CHANNEL: ${{ github.base_ref == 'develop' && 'development' || 'production' }}

  build:
    name: Build main and develop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: production
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: actions/checkout@v7
        with:
          ref: develop
          path: development
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production/docs/package-lock.json
            development/docs/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes exact version tags only
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "*/uv.lock"

      # Each channel publishes the REST API spec of its own branch. A branch from before the
      # export script existed has no spec, and its docs don't link to one.
      - name: Export the OpenAPI spec (main)
        working-directory: production
        run: |
          if [ -f scripts/export_openapi.py ]; then
            uv sync --frozen --no-dev
            uv run --no-sync python scripts/export_openapi.py docs/public/openapi.json
          fi

      - name: Build production (main)
        working-directory: production/docs
        env:
          DOCS_CHANNEL: production
        run: |
          npm ci
          npm run docs:build

      - name: Export the OpenAPI spec (develop)
        working-directory: development
        run: |
          if [ -f scripts/export_openapi.py ]; then
            uv sync --frozen --no-dev
            uv run --no-sync python scripts/export_openapi.py docs/public/openapi.json
          fi

      - name: Build development (develop)
        working-directory: development/docs
        env:
          DOCS_CHANNEL: development
        run: |
          npm ci
          npm run docs:build

      - name: Combine into one site
        run: |
          site=production/docs/.vitepress/dist
          cp -R development/docs/.vitepress/dist "$site/dev"
          rm -f "$site/dev/CNAME" # the custom domain belongs to the site root

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: production/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
