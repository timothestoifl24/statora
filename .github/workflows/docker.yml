name: Container image

# main (production): merging a new version from pyproject.toml publishes X.Y.Z, X.Y, latest and
#   creates the release vX.Y.Z, then opens a pull request moving develop on to X.Y.Z+1.
# develop (pre-release): every push publishes X.Y.Z-beta.N and beta and creates a pre-release.
# Pull requests into develop (from this repository): every push removes the pull request comment of
#   the previous image, publishes develop-pr-N, deletes the image it replaces (also when the run is
#   cancelled) and posts a new comment on how to pull it. pr-image-cleanup.yml deletes the image
#   when the pull request is merged or closed.
# Other pull requests (forks, into main): build and smoke test only.
# See .github/scripts/release_version.py for the rules.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Read-only by default; the jobs that publish or release ask for more themselves.
permissions:
  contents: read

env:
  # Docker Hub repository; pushing needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets (a
  # personal access token with Read, Write, Delete access: the cleanup jobs delete tags).
  IMAGE: docker.io/${{ github.repository_owner }}/statora

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image_tags: ${{ steps.version.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags decide the next beta number and whether a version is released
      - name: Decide version and tags
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: python3 .github/scripts/release_version.py
      - name: Summary
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          IMAGE_TAGS: ${{ steps.version.outputs.image_tags }}
        run: |
          {
            echo "### ${CHANNEL}: ${VERSION}"
            echo "Publish: ${PUBLISH}"
            echo
            for t in $IMAGE_TAGS; do echo "- \`$t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  pr-comment:
    name: Remove the previous image's comment
    # As soon as a rebuild starts, so the pull request never points at an image that is going away.
    # The pr-image job posts a new comment once the new image is published.
    needs: version
    if: needs.version.outputs.channel == 'pr'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # delete the comment
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Delete the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/pr_image.py uncomment

  smoke-test:
    name: Smoke test
    needs: version
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statora
          POSTGRES_PASSWORD: statora
          POSTGRES_DB: statora
        options: >-
          --health-cmd "pg_isready -U statora" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg STATORA_BUILD_VERSION="$VERSION" -t statora:test .
      - name: Start hardened container and wait for /healthz
        run: |
          docker run -d --name statora --network ${{ job.services.postgres.network }} -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --sysctl net.ipv4.ping_group_range="0 2147483647" \
            -e STATORA_DATABASE_URL=postgresql+asyncpg://statora:statora@postgres:5432/statora \
            -e STATORA_REDIS_URL=redis://redis:6379/0 \
            -e STATORA_SECRET_KEY=ci-smoke-test-secret-key-0123456789 \
            statora:test
          for _ in $(seq 1 60); do curl -sf http://localhost:8000/healthz && exit 0; sleep 2; done
          exit 1
      - name: Seed demo data, render the status page, check the version
        run: |
          docker exec statora statora seed
          curl -sf http://localhost:8000/s/demo | grep -q "Demo Status"
          reported=$(curl -sf http://localhost:8000/api/openapi.json | jq -r .info.version)
          echo "API reports version $reported"
          test "$reported" = "$VERSION"
      - name: Container logs
        if: always()
        run: docker logs statora 2>&1 | tail -100 || true
      - name: Remove container
        # Detach it from the service network, or GitHub's network cleanup fails with a warning.
        if: always()
        run: docker rm -f statora || true

  build:
    name: Build ${{ matrix.platform }}
    # Only images that passed the smoke test are published.
    needs: [version, smoke-test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners for both architectures: compiling lxml/xmlsec under QEMU takes ages.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - name: Platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Statora
            org.opencontainers.image.description=Self-hosted uptime monitoring and status pages
            org.opencontainers.image.url=https://statora.timothestoifl24.dev
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: STATORA_BUILD_VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          outputs: >-
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        if: needs.version.outputs.channel == 'pr'
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image the pull request tag points to now
        id: previous
        if: needs.version.outputs.channel == 'pr'
        env:
          IMAGE_TAGS: ${{ needs.version.outputs.image_tags }}
        run: |
          # Empty on the first build; pr_image.py deletes this image once the tag has moved on.
          digest=$(docker buildx imagetools inspect "$IMAGE_TAGS" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAGS: ${{ needs.version.outputs.image_tags }}
        run: |
          args=()
          for t in $IMAGE_TAGS; do args+=(-t "$t"); done
          sources=()
          for d in *; do sources+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Manifest digest
        id: manifest
        env:
          IMAGE_TAGS: ${{ needs.version.outputs.image_tags }}
        run: |
          first=${IMAGE_TAGS%% *}
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - name: Delete the image this build replaces
        # Here rather than in a later job, and also when the run is cancelled (a newer push or
        # closing the pull request): otherwise the old image would be left behind once the tag
        # has moved. An image that still carries the pull request tag is kept.
        if: always() && needs.version.outputs.channel == 'pr' && steps.previous.outputs.digest != ''
        env:
          DOCKERHUB_NAMESPACE: ${{ github.repository_owner }}
          DOCKERHUB_REPOSITORY: statora
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OLD_DIGEST: ${{ steps.previous.outputs.digest }}
        run: python3 .github/scripts/pr_image.py replace

      - name: Attest build provenance
        # Pull request images are short-lived; they go without provenance.
        if: needs.version.outputs.channel != 'pr'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  pr-image:
    name: Pull request image
    needs: [version, publish]
    if: needs.version.outputs.channel == 'pr'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # post the comment on how to pull the image
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      DOCKERHUB_NAMESPACE: ${{ github.repository_owner }}
      DOCKERHUB_REPOSITORY: statora
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Comment how to pull the image
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/pr_image.py comment

  release:
    name: Release ${{ needs.version.outputs.tag }}
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true' && needs.version.outputs.channel != 'pr'
    runs-on: ubuntu-24.04
    # Records a GitHub deployment per release, which GitHub for Jira links to the shipped issues.
    environment:
      name: ${{ needs.version.outputs.channel == 'stable' && 'production' || 'beta' }}
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          {
            if [ "$CHANNEL" = "beta" ]; then
              echo "> **Pre-release** built from \`develop\` for testing upcoming features. Not intended for production."
              echo
              echo "Container image: \`${IMAGE}:${VERSION}\` (or \`${IMAGE}:beta\` for the newest beta)."
              echo
              echo "## Changes in the upcoming ${VERSION%%-*} so far"
            else
              echo "Container image: \`${IMAGE}:${VERSION}\` (also \`${IMAGE}:latest\`)."
              echo
              echo "## What's new"
            fi
            echo
            python3 .github/scripts/changelog.py section "$VERSION" || echo "_No changelog entry for this version._"
          } > notes.md
          cat notes.md
      - name: Create tag and GitHub release
        # The tag is created here, on the commit that was built and published. GitHub appends the list
        # of merged pull requests after the changelog section.
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Statora $VERSION" \
              --prerelease --latest=false --generate-notes --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Statora $VERSION" \
              --latest --generate-notes --notes-file notes.md
          fi

  cleanup-betas:
    name: Clean up betas up to ${{ needs.version.outputs.version }}
    needs: [version, release]
    if: needs.version.outputs.channel == 'stable'
    permissions:
      contents: write
    uses: ./.github/workflows/cleanup-betas.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, to delete the beta images

  bump-develop:
    name: Open the next version on develop
    # A release leaves develop on the version that was just released, which blocks its betas.
    needs: [version, release]
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the branch
      pull-requests: write # open the pull request
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Bump pyproject.toml and CHANGELOG.md
        id: bump
        env:
          RELEASED_VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/open_next_version.py
      - name: Open the pull request
        if: steps.bump.outputs.bump == 'true'
        env:
          RELEASED: ${{ needs.version.outputs.version }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Open $VERSION for development"
          # Fetch first, so --force-with-lease sees any branch a previous attempt left behind.
          git fetch --no-tags origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"

          cat > body.md <<EOF
          $RELEASED is released, so develop moves on to $VERSION and its betas become \`$VERSION-beta.N\`.

          Bump \`pyproject.toml\` again and rename the changelog section if the next release is a minor or
          major one. Notes collect under the \`Unreleased\` section in \`CHANGELOG.md\`; the date is set
          when the version is released.
          EOF

          if [ -n "$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[].number')" ]; then
            echo "::notice::A pull request for $BRANCH is already open; it has the new commit."
            exit 0
          fi
          if ! gh pr create --base develop --head "$BRANCH" --title "Open $VERSION for development" --body-file body.md; then
            echo "::error::Could not open the pull request; $BRANCH is pushed. If this is a permission error, turn on Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests'."
            exit 1
          fi
