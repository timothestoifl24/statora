name: Container image

# main (production): merging a new version from pyproject.toml publishes X.Y.Z, X.Y, latest and
#   creates the release vX.Y.Z.
# develop (pre-release): every push publishes X.Y.Z-beta.N and beta and creates a pre-release.
# Pull requests: build and smoke test only. See .github/scripts/release_version.py for the rules.
on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - "src/**"
      - .github/workflows/docker.yml
      - .github/scripts/release_version.py
      - .github/scripts/changelog.py
      - CHANGELOG.md
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/statora

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image_tags: ${{ steps.version.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags decide the next beta number and whether a version is released
      - name: Decide version and tags
        id: version
        run: python3 .github/scripts/release_version.py
      - name: Summary
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          IMAGE_TAGS: ${{ steps.version.outputs.image_tags }}
        run: |
          {
            echo "### ${CHANNEL}: ${VERSION}"
            echo "Publish: ${PUBLISH}"
            echo
            for t in $IMAGE_TAGS; do echo "- \`$t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Smoke test
    needs: version
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statora
          POSTGRES_PASSWORD: statora
          POSTGRES_DB: statora
        options: >-
          --health-cmd "pg_isready -U statora" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg STATORA_BUILD_VERSION="$VERSION" -t statora:test .
      - name: Start hardened container and wait for /healthz
        run: |
          docker run -d --name statora --network ${{ job.services.postgres.network }} -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --sysctl net.ipv4.ping_group_range="0 2147483647" \
            -e STATORA_DATABASE_URL=postgresql+asyncpg://statora:statora@postgres:5432/statora \
            -e STATORA_REDIS_URL=redis://redis:6379/0 \
            -e STATORA_SECRET_KEY=ci-smoke-test-secret-key-0123456789 \
            statora:test
          for _ in $(seq 1 60); do curl -sf http://localhost:8000/healthz && exit 0; sleep 2; done
          exit 1
      - name: Seed demo data, render the status page, check the version
        run: |
          docker exec statora statora seed
          curl -sf http://localhost:8000/s/demo | grep -q "Demo Status"
          reported=$(curl -sf http://localhost:8000/api/openapi.json | jq -r .info.version)
          echo "API reports version $reported"
          test "$reported" = "$VERSION"
      - name: Container logs
        if: always()
        run: docker logs statora 2>&1 | tail -100 || true
      - name: Remove container
        # Detach it from the service network, or GitHub's network cleanup fails with a warning.
        if: always()
        run: docker rm -f statora || true

  build:
    name: Build ${{ matrix.platform }}
    # Only images that passed the smoke test are published.
    needs: [version, smoke-test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners for both architectures: compiling lxml/xmlsec under QEMU takes ages.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
    steps:
      - name: Platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Statora
            org.opencontainers.image.description=Self-hosted uptime monitoring and status pages
            org.opencontainers.image.url=https://statora.stoifl.app
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: STATORA_BUILD_VERSION=${{ needs.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          outputs: >-
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAGS: ${{ needs.version.outputs.image_tags }}
        run: |
          args=()
          for t in $IMAGE_TAGS; do args+=(-t "$t"); done
          sources=()
          for d in *; do sources+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Manifest digest
        id: manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          echo "digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    name: Release ${{ needs.version.outputs.tag }}
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          {
            if [ "$CHANNEL" = "beta" ]; then
              echo "> **Pre-release** built from \`develop\` for testing upcoming features. Not intended for production."
              echo
              echo "Container image: \`${IMAGE}:${VERSION}\` (or \`${IMAGE}:beta\` for the newest beta)."
              echo
              echo "## Changes in the upcoming ${VERSION%%-*} so far"
            else
              echo "Container image: \`${IMAGE}:${VERSION}\` (also \`${IMAGE}:latest\`)."
              echo
              echo "## What's new"
            fi
            echo
            python3 .github/scripts/changelog.py section "$VERSION" || echo "_No changelog entry for this version._"
          } > notes.md
          cat notes.md
      - name: Create tag and GitHub release
        # The tag is created here, on the commit that was built and published. GitHub appends the list
        # of merged pull requests after the changelog section.
        run: |
          if [ "$CHANNEL" = "beta" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Statora $VERSION" \
              --prerelease --latest=false --generate-notes --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Statora $VERSION" \
              --latest --generate-notes --notes-file notes.md
          fi
