name: Container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - "src/**"
      - .github/workflows/docker.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/statora

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Statora
            org.opencontainers.image.description=Self-hosted uptime monitoring and status pages
            org.opencontainers.image.url=https://statora.stoifl.app

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: statora
          POSTGRES_PASSWORD: statora
          POSTGRES_DB: statora
        options: >-
          --health-cmd "pg_isready -U statora" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t statora:test .
      - name: Start hardened container and wait for /healthz
        run: |
          docker run -d --name statora --network ${{ job.services.postgres.network }} -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --sysctl net.ipv4.ping_group_range="0 2147483647" \
            -e STATORA_DATABASE_URL=postgresql+asyncpg://statora:statora@postgres:5432/statora \
            -e STATORA_REDIS_URL=redis://redis:6379/0 \
            -e STATORA_SECRET_KEY=ci-smoke-test-secret-key-0123456789 \
            statora:test
          for _ in $(seq 1 60); do curl -sf http://localhost:8000/healthz && exit 0; sleep 2; done
          docker logs statora; exit 1
      - name: Seed demo data and render the status page
        run: |
          docker exec statora statora seed
          curl -sf http://localhost:8000/s/demo | grep -q "Demo Status"
          curl -sf http://localhost:8000/api/openapi.json > /dev/null

  release:
    name: GitHub release
    needs: [image, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Statora $GITHUB_REF_NAME" \
            --notes "Container image: \`ghcr.io/${{ github.repository_owner }}/statora:${GITHUB_REF_NAME#v}\`"
