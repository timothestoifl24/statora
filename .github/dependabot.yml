version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /docs
    target-branch: develop
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
