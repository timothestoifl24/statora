{% extends "admin/base.html" %}
{% block title %}{{ 'Edit ' ~ page.title if page else 'New status page' }}{% endblock %}
{% block content %}
<style>
  .drag-handle { cursor: grab; }
  .dragging { opacity: .4; }
  .group-card .items { min-height: 2.5rem; }
</style>
<form method="post" id="page-form" autocomplete="off">
  {{ csrf_input(request) }}
  <input type="hidden" name="groups_json" id="groups_json">
  <div class="row row-cards">
    <div class="col-lg-5">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Page</h3>
          {% if page %}
          <div class="card-actions">
            <a href="/s/{{ page.slug }}" target="_blank" rel="noopener" class="btn btn-sm btn-primary">
              <i class="ti ti-external-link me-1"></i>View status page
            </a>
          </div>
          {% endif %}
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label required" for="title">Title</label>
            <input class="form-control" id="title" name="title" value="{{ values.title }}" required maxlength="150">
          </div>
          <div class="mb-3">
            <label class="form-label required" for="slug">Slug</label>
            <div class="input-group">
              <span class="input-group-text">/s/</span>
              <input class="form-control" id="slug" name="slug" value="{{ values.slug }}" required pattern="[a-z0-9][a-z0-9\-]*" maxlength="100">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Description <span class="text-secondary">(Markdown)</span></label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ values.description or '' }}</textarea>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-8">
              <label class="form-label" for="logo_url">Logo URL</label>
              <input class="form-control" id="logo_url" name="logo_url" value="{{ values.logo_url or '' }}" placeholder="https://…/logo.svg">
            </div>
            <div class="col-4">
              <label class="form-label" for="accent_color">Accent</label>
              <input type="color" class="form-control form-control-color w-100" id="accent_color" name="accent_color" value="{{ values.accent_color }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="footer_text">Footer <span class="text-secondary">(Markdown)</span></label>
            <textarea class="form-control" id="footer_text" name="footer_text" rows="2">{{ values.footer_text or '' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label" for="history_resolution">Uptime bars</label>
            <select class="form-select" id="history_resolution" name="history_resolution">
              {% for value, label in [('minute', 'Per minute, last 2 hours'), ('hour', 'Per hour, last 5 days'), ('day', 'Per day, last 4 months')] %}
                <option value="{{ value }}" {{ 'selected' if values.history_resolution == value }}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          <label class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="published" {{ 'checked' if values.published }}>
            <span class="form-check-label">Published</span>
          </label>
          <label class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_default" {{ 'checked' if values.is_default }}>
            <span class="form-check-label">Default page (served at <code>/</code>)</span>
          </label>
          <label class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="show_powered_by" {{ 'checked' if values.show_powered_by }}>
            <span class="form-check-label">Show “Powered by Statora” in the footer</span>
          </label>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Components</h3>
          <div class="card-actions">
            <button type="button" class="btn btn-sm" id="add-group"><i class="ti ti-plus me-1"></i>Add group</button>
          </div>
        </div>
        <div class="card-body" id="groups"></div>
      </div>
    </div>
  </div>
  <div class="d-flex mt-3">
    <a href="/admin/pages" class="btn btn-link">Cancel</a>
    <button type="submit" class="btn btn-primary ms-auto">{{ 'Save' if page else 'Create status page' }}</button>
  </div>
</form>

<template id="group-template">
  <div class="card group-card mb-3">
    <div class="card-body">
      <div class="d-flex gap-2 mb-2">
        <span class="btn btn-icon btn-ghost-secondary drag-handle" title="Drag to reorder" aria-hidden="true"><i class="ti ti-grip-vertical"></i></span>
        <input class="form-control group-name" placeholder="Group name, e.g. Websites" required>
        <button type="button" class="btn btn-icon move-up" title="Move up" aria-label="Move group up"><i class="ti ti-arrow-up"></i></button>
        <button type="button" class="btn btn-icon move-down" title="Move down" aria-label="Move group down"><i class="ti ti-arrow-down"></i></button>
        <button type="button" class="btn btn-icon btn-ghost-danger remove" title="Remove group" aria-label="Remove group"><i class="ti ti-trash"></i></button>
      </div>
      <div class="list-group list-group-flush items mb-2"></div>
      <select class="form-select form-select-sm add-item"><option value="">+ Add monitor…</option></select>
    </div>
  </div>
</template>
<template id="item-template">
  <div class="list-group-item px-0 group-item">
    <div class="d-flex gap-2 align-items-center">
      <span class="text-secondary drag-handle flex-shrink-0" title="Drag to reorder or into another group" aria-hidden="true"><i class="ti ti-grip-vertical"></i></span>
      <span class="badge badge-outline text-secondary item-type flex-shrink-0"></span>
      <input class="form-control form-control-sm item-label" placeholder="Public name (optional)">
      <span class="text-secondary small text-nowrap item-monitor"></span>
      <button type="button" class="btn btn-sm btn-icon btn-ghost-secondary item-up" aria-label="Move up"><i class="ti ti-chevron-up"></i></button>
      <button type="button" class="btn btn-sm btn-icon btn-ghost-secondary item-down" aria-label="Move down"><i class="ti ti-chevron-down"></i></button>
      <button type="button" class="btn btn-sm btn-icon btn-ghost-danger item-remove" aria-label="Remove"><i class="ti ti-x"></i></button>
    </div>
  </div>
</template>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var monitors = {{ monitors|tojson }};
  var initial = {{ values.groups|tojson }};
  var byId = {};
  monitors.forEach(function (m) { byId[m.id] = m; });
  var container = document.getElementById("groups");

  function move(el, dir) {
    if (dir < 0 && el.previousElementSibling) el.parentNode.insertBefore(el, el.previousElementSibling);
    if (dir > 0 && el.nextElementSibling) el.parentNode.insertBefore(el.nextElementSibling, el);
  }

  // Drag and drop: an element is draggable only while its handle is held, so text in the
  // inputs can still be selected. Monitors can also be dropped into another group.
  var dragged = null;

  function draggable(el) {
    el.querySelector(".drag-handle").addEventListener("mousedown", function () { el.draggable = true; });
    el.addEventListener("dragstart", function (e) {
      if (!el.draggable) return;
      e.stopPropagation(); // dragging a monitor must not drag its group
      dragged = el;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "");
      setTimeout(function () { el.classList.add("dragging"); });
    });
    el.addEventListener("dragend", function (e) {
      e.stopPropagation();
      el.draggable = false;
      el.classList.remove("dragging");
      dragged = null;
    });
  }

  function sortable(list, kind) {
    list.addEventListener("dragover", function (e) {
      if (!dragged || !dragged.classList.contains(kind)) return;
      e.preventDefault();
      e.stopPropagation();
      var before = Array.from(list.children).find(function (child) {
        var box = child.getBoundingClientRect();
        return child !== dragged && child.classList.contains(kind) && e.clientY < box.top + box.height / 2;
      });
      if (before) { if (before.previousElementSibling !== dragged) list.insertBefore(dragged, before); }
      else if (list.lastElementChild !== dragged) list.appendChild(dragged);
    });
    list.addEventListener("drop", function (e) {
      if (dragged && dragged.classList.contains(kind)) e.preventDefault();
    });
  }

  document.addEventListener("mouseup", function () {
    container.querySelectorAll("[draggable=true]").forEach(function (el) { if (el !== dragged) el.draggable = false; });
  });
  sortable(container, "group-card");

  function addItem(groupEl, item) {
    var m = byId[item.monitor_id];
    if (!m) return;
    var el = document.getElementById("item-template").content.firstElementChild.cloneNode(true);
    el.dataset.monitorId = m.id;
    el.querySelector(".item-type").textContent = m.type.toUpperCase();
    el.querySelector(".item-monitor").textContent = m.name;
    el.querySelector(".item-label").value = item.display_name || "";
    el.querySelector(".item-label").placeholder = m.name;
    el.querySelector(".item-up").onclick = function () { move(el, -1); };
    el.querySelector(".item-down").onclick = function () { move(el, 1); };
    el.querySelector(".item-remove").onclick = function () { el.remove(); };
    draggable(el);
    groupEl.querySelector(".items").appendChild(el);
  }

  function addGroup(group) {
    var el = document.getElementById("group-template").content.firstElementChild.cloneNode(true);
    el.querySelector(".group-name").value = group.name || "";
    var select = el.querySelector(".add-item");
    monitors.forEach(function (m) {
      var opt = document.createElement("option");
      opt.value = m.id; opt.textContent = m.name + " (" + m.type.toUpperCase() + ")";
      select.appendChild(opt);
    });
    select.onchange = function () {
      if (select.value) addItem(el, { monitor_id: Number(select.value) });
      select.value = "";
    };
    el.querySelector(".move-up").onclick = function () { move(el, -1); };
    el.querySelector(".move-down").onclick = function () { move(el, 1); };
    el.querySelector(".remove").onclick = function () { el.remove(); };
    draggable(el);
    sortable(el.querySelector(".items"), "group-item");
    (group.items || []).forEach(function (item) { addItem(el, item); });
    container.appendChild(el);
  }

  document.getElementById("add-group").onclick = function () { addGroup({ name: "", items: [] }); };
  initial.forEach(addGroup);
  if (!initial.length) addGroup({ name: "Services", items: [] });

  document.getElementById("page-form").addEventListener("submit", function () {
    var groups = Array.from(container.querySelectorAll(".group-card")).map(function (g) {
      return {
        name: g.querySelector(".group-name").value.trim(),
        items: Array.from(g.querySelectorAll(".group-item")).map(function (i) {
          var label = i.querySelector(".item-label").value.trim();
          return { monitor_id: Number(i.dataset.monitorId), display_name: label || null };
        })
      };
    });
    document.getElementById("groups_json").value = JSON.stringify(groups);
  });
})();
</script>
{% endblock %}
