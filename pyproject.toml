[project]
name = "statora"
version = "0.1.0"
description = "Self-hosted uptime monitoring and public status pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.28",
    "dnspython>=2.7",
    "icmplib>=3.0",
    "typer>=0.13",
    "markdown>=3.7",
    "nh3>=0.2.18",
    "ldap3>=2.9",
    "joserfc>=1.0",
]

[project.optional-dependencies]
saml = ["python3-saml>=1.16"]

[project.scripts]
statora = "statora.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.26",
    "openapi-spec-validator>=0.7",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# E501: the formatter wraps code; long strings are fine. UP046: keep pydantic generics explicit.
ignore = ["B008", "E501", "UP046"]
